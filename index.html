<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>QUEROSENO — Laboratorio interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#0b0d0c; --bg2:#12100c; --surface:#17140f; --surface2:#1e1a13;
  --line:#2c2619; --gold:#d4a72c; --gold-soft:#e9c65b; --amber:#e8792b;
  --yellow:#f4c542; --green:#5c9271; --green-soft:#8fc4a3;
  --text:#efe9db; --text-dim:#a89f8c; --danger:#d9614f;
}
html,body{background:var(--bg);}
body{margin:0;font-family:'Inter',sans-serif;color:var(--text);
  background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 65%);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
h1,h2,h3,.font-display{font-family:'Fraunces',serif;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.tab-btn{transition:color .2s ease, transform .15s ease;}
.tab-btn.active{color:var(--gold-soft);}
.tab-btn:active{transform:scale(.92);}
.card-appear{animation:appear .3s ease both;}
@keyframes appear{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.chip{cursor:pointer;transition:all .18s ease;}
.chip:active{transform:scale(.95);}
.slider{-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--green-soft) 0%, var(--gold) 100%); outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--text);border:3px solid var(--gold);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:3px solid var(--gold);cursor:pointer;}
.flame{transform-origin:center bottom; animation:flicker 1.1s ease-in-out infinite alternate;}
@keyframes flicker{0%{transform:scaleY(1) scaleX(1);}50%{transform:scaleY(1.06) scaleX(.97) translateY(-1.5px);}100%{transform:scaleY(.96) scaleX(1.03) translateY(1px);}}
.flame.off{animation:none;opacity:0;}
.pipe-flow{animation:flow 1.4s linear infinite;} @keyframes flow{to{stroke-dashoffset:-24;}}
.tank-liquid{transition:height .6s ease, y .6s ease;}
.molecule{animation:drift 5s ease-in-out infinite;} @keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(3px,-4px);}}
.rise{animation:riseUp 3.4s ease-in-out infinite;} @keyframes riseUp{0%{transform:translateY(0);opacity:.15;}50%{opacity:.7;}100%{transform:translateY(-90px);opacity:.05;}}
.fall{animation:fallDown 3.8s ease-in-out infinite;} @keyframes fallDown{0%{transform:translateY(-90px);opacity:.05;}50%{opacity:.6;}100%{transform:translateY(0);opacity:.15;}}
.plane-fly{animation:fly 2.6s ease-in-out infinite;} @keyframes fly{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.puff{animation:puffOut 2.4s ease-out infinite;} @keyframes puffOut{0%{transform:translateX(0) scale(.5);opacity:.6;}100%{transform:translateX(-30px) scale(1.3);opacity:0;}}
.badge-glow{animation:bglow 1.8s ease-in-out infinite;} @keyframes bglow{0%,100%{opacity:.5;}50%{opacity:1;}}
.progress-fill{transition:width .5s ease;}
@media (prefers-reduced-motion: reduce){.flame,.pipe-flow,.molecule,.rise,.fall,.plane-fly,.puff,.badge-glow{animation:none!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   ICONOS (SVG propios — sustituyen a lucide-react, ver nota final)
============================================================ */
const Ic = {
  Explorar: (a) => <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.6"/><path d="M15 9l-2 5-5 2 2-5 5-2Z" fill={a?"currentColor":"none"} stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>,
  Produccion: (a) => <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 20V11l5 3V11l5 3V9l5 3v8H4Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" fill={a?"currentColor":"none"} fillOpacity={a?.12:0}/><path d="M4 20h16" stroke="currentColor" strokeWidth="1.6"/></svg>,
  Simulador: (a) => <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c1.2 1 2 2.6 2 4.2A5 5 0 0 1 7 14c0-4 3-5 3-8 .8.6 1.4 1.6 1.4 2.8C13 6 12.2 3.6 12 2Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" fill={a?"currentColor":"none"} fillOpacity={a?.15:0}/></svg>,
  Aviacion: (a) => <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M2 16l8-2 3-8 2 1-1.5 7.5L20 12l1 2-6.5 3.5L14 21l-2-1-.5-4L4 18l-2-2Z" fill={a?"currentColor":"none"} stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" fillOpacity={a?.15:0}/></svg>,
  Impacto: (a) => <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-7-10a7 7 0 0 1 14 0c0 5.6-7 10-7 10Z" stroke="currentColor" strokeWidth="1.6" fill={a?"currentColor":"none"} fillOpacity={a?.14:0}/><circle cx="12" cy="11" r="2.4" stroke="currentColor" strokeWidth="1.4"/></svg>,
};

/* ============================================================
   NAV INFERIOR
============================================================ */
function BottomNav({screen,setScreen}){
  const items=[
    {id:"explorar",label:"Explorar",icon:Ic.Explorar},
    {id:"produccion",label:"Producción",icon:Ic.Produccion},
    {id:"simulador",label:"Simulador",icon:Ic.Simulador},
    {id:"aviacion",label:"Aviación",icon:Ic.Aviacion},
    {id:"impacto",label:"Impacto",icon:Ic.Impacto},
  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 z-30 border-t" style={{background:"rgba(11,13,12,0.94)",backdropFilter:"blur(8px)",borderColor:"var(--line)"}}>
      <div className="max-w-md mx-auto flex">
        {items.map(it=>{const active=screen===it.id;
          return (
            <button key={it.id} onClick={()=>setScreen(it.id)}
              className={"tab-btn flex-1 flex flex-col items-center gap-1 py-2.5 "+(active?"active":"")}
              style={{color:active?"var(--gold-soft)":"var(--text-dim)"}}>
              {it.icon(active)}
              <span className="text-[10px] tracking-wide">{it.label}</span>
            </button>
          );})}
      </div>
    </nav>
  );
}

function SectionTitle({eyebrow,title,sub}){
  return (
    <div className="mb-5">
      <p className="text-xs tracking-[0.14em] uppercase" style={{color:"var(--green-soft)"}}>{eyebrow}</p>
      <h1 className="font-display text-3xl mt-1 mb-1">{title}</h1>
      {sub && <p className="text-sm" style={{color:"var(--text-dim)"}}>{sub}</p>}
    </div>
  );
}
function Panel({children,k}){
  return <div key={k} className="card-appear rounded-2xl p-4 mt-3" style={{background:"var(--surface)",border:"1px solid var(--line)"}}>{children}</div>;
}

/* ============================================================
   PANTALLA 1 — EXPLORAR
============================================================ */
const EXPLORAR_CARDS=[
  {id:"que-es",emoji:"🛢️",title:"¿Qué es?"},
  {id:"historia",emoji:"🕰️",title:"Historia"},
  {id:"composicion",emoji:"⚛️",title:"Composición química"},
  {id:"propiedades",emoji:"🌡️",title:"Propiedades físicas"},
  {id:"tipos",emoji:"🧪",title:"Tipos de queroseno"},
  {id:"usos",emoji:"💡",title:"Usos"},
  {id:"balance",emoji:"⚖️",title:"Ventajas y desventajas"},
  {id:"seguridad",emoji:"🛡️",title:"Seguridad"},
];

function QueEsPanel(){
  const pasos=[
    {id:"petroleo",t:"Petróleo",d:"Materia prima líquida extraída del subsuelo, formada por una mezcla de hidrocarburos."},
    {id:"refinacion",t:"Refinación",d:"El petróleo se calienta y se separa en distintas fracciones según su punto de ebullición."},
    {id:"queroseno",t:"Queroseno",d:"Una de esas fracciones: una mezcla de hidrocarburos de entre 10 y 16 átomos de carbono."},
    {id:"energia",t:"Energía",d:"Al quemarse en presencia de oxígeno, libera energía principalmente en forma de calor."},
  ];
  const [sel,setSel]=useState("queroseno");
  const activo=pasos.find(p=>p.id===sel);
  return (
    <div>
      <p className="text-sm mb-3">El queroseno es un combustible líquido obtenido a partir de la refinación del petróleo. Desde el siglo XIX se usó para iluminación y calefacción, y hoy es clave como combustible para aviones de reacción.</p>
      <div className="flex items-center justify-between gap-1 mb-3">
        {pasos.map((p,i)=>(
          <React.Fragment key={p.id}>
            <button onClick={()=>setSel(p.id)} className="chip flex-1 rounded-xl py-2 px-1 text-[11px] text-center"
              style={{background:sel===p.id?"var(--surface2)":"transparent",border:"1px solid "+(sel===p.id?"var(--gold)":"var(--line)"),color:sel===p.id?"var(--gold-soft)":"var(--text-dim)"}}>
              {p.t}
            </button>
            {i<pasos.length-1 && <span style={{color:"var(--text-dim)"}}>→</span>}
          </React.Fragment>
        ))}
      </div>
      <div key={sel} className="pop text-sm rounded-xl p-3" style={{background:"var(--surface2)",color:"var(--text)"}}>{activo.d}</div>
    </div>
  );
}

function HistoriaPanel(){
  const linea=[
    {t:"Siglo XIX",uso:"Se difunde como combustible para lámparas de iluminación.",imp:"Reemplazó al aceite de ballena, mucho más caro y escaso.",cambio:"Su demanda impulsó las primeras refinerías de petróleo."},
    {t:"Expansión del uso",uso:"Se extiende también a la calefacción doméstica.",imp:"Permitió calentar hogares de forma más accesible.",cambio:"Creció la industria petrolera para abastecer la demanda."},
    {t:"Aparición de la electricidad",uso:"La luz eléctrica empieza a reemplazar a las lámparas de queroseno.",imp:"El queroseno pierde protagonismo como fuente de iluminación.",cambio:"La industria busca nuevos usos para esta fracción del petróleo."},
    {t:"Industria y transporte",uso:"Se lo empieza a usar como solvente y combustible industrial.",imp:"Se aprovechan sus propiedades como líquido poco volátil.",cambio:"Sienta las bases para su uso en motores de reacción."},
    {t:"Aviación moderna",uso:"Se convierte en el combustible estándar de los motores a reacción.",imp:"Su alto contenido energético lo hace ideal para volar largas distancias.",cambio:"Hoy es uno de los combustibles más importantes de la aviación comercial."},
  ];
  const [i,setI]=useState(4);
  const p=linea[i];
  return (
    <div>
      <div className="flex items-center mb-3">
        {linea.map((l,idx)=>(
          <React.Fragment key={idx}>
            <button onClick={()=>setI(idx)} className="chip rounded-full flex items-center justify-center shrink-0"
              style={{width:16,height:16,background:idx<=i?"var(--gold)":"var(--surface2)",border:"1px solid var(--line)"}}/>
            {idx<linea.length-1 && <div className="flex-1 h-[2px]" style={{background:idx<i?"var(--gold)":"var(--line)"}}/>}
          </React.Fragment>
        ))}
      </div>
      <p className="text-xs mb-2" style={{color:"var(--text-dim)"}}>Deslizá por los puntos de la línea de tiempo.</p>
      <div key={i} className="pop rounded-xl p-3 text-sm space-y-2" style={{background:"var(--surface2)"}}>
        <p className="font-display text-base" style={{color:"var(--gold-soft)"}}>{p.t}</p>
        <p><span style={{color:"var(--green-soft)"}}>Uso: </span>{p.uso}</p>
        <p><span style={{color:"var(--green-soft)"}}>Importancia: </span>{p.imp}</p>
        <p><span style={{color:"var(--green-soft)"}}>Qué cambió: </span>{p.cambio}</p>
      </div>
    </div>
  );
}

function Molecula({tipo}){
  if(tipo==="alcanos") return (
    <svg viewBox="0 0 160 40" width="100%" height="40">
      {[0,1,2,3,4].map(i=>(<g key={i}><circle cx={16+i*32} cy="20" r="7" fill="var(--gold)"/>{i<4 && <line x1={23+i*32} y1="20" x2={9+(i+1)*32} y2="20" stroke="var(--text-dim)" strokeWidth="2"/>}</g>))}
    </svg>
  );
  if(tipo==="cicloalcanos") return (
    <svg viewBox="0 0 100 80" width="100%" height="60">
      <polygon points="50,8 85,30 72,68 28,68 15,30" fill="none" stroke="var(--green-soft)" strokeWidth="2.5"/>
      {[[50,8],[85,30],[72,68],[28,68],[15,30]].map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="6" fill="var(--green-soft)"/>))}
    </svg>
  );
  return (
    <svg viewBox="0 0 100 90" width="100%" height="60">
      <polygon points="50,6 88,28 88,62 50,84 12,62 12,28" fill="none" stroke="var(--amber)" strokeWidth="2.5"/>
      <polygon points="50,20 74,33 74,57 50,70 26,57 26,33" fill="none" stroke="var(--amber)" strokeWidth="1.4" opacity="0.6"/>
      {[[50,6],[88,28],[88,62],[50,84],[12,62],[12,28]].map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="5.5" fill="var(--amber)"/>))}
    </svg>
  );
}

function ComposicionPanel(){
  const cats=[
    {id:"alcanos",t:"Alcanos",d:"Hidrocarburos de cadena abierta, con enlaces simples entre carbonos. Son el componente más común del queroseno."},
    {id:"cicloalcanos",t:"Cicloalcanos",d:"Hidrocarburos con su cadena de carbonos cerrada en forma de anillo."},
    {id:"aromaticos",t:"Hidrocarburos aromáticos",d:"Moléculas con anillos especiales (tipo benceno), presentes en menor proporción."},
  ];
  const [sel,setSel]=useState("alcanos");
  const c=cats.find(x=>x.id===sel);
  return (
    <div>
      <p className="text-sm mb-3">El queroseno no tiene una única fórmula química: es una <span style={{color:"var(--gold-soft)"}}>mezcla de hidrocarburos</span>, principalmente con entre 10 y 16 átomos de carbono por molécula.</p>
      <div className="flex gap-2 mb-3">
        {cats.map(cat=>(
          <button key={cat.id} onClick={()=>setSel(cat.id)} className="chip flex-1 rounded-xl py-2 text-[11px]"
            style={{background:sel===cat.id?"var(--surface2)":"transparent",border:"1px solid "+(sel===cat.id?"var(--gold)":"var(--line)"),color:sel===cat.id?"var(--gold-soft)":"var(--text-dim)"}}>
            {cat.t}
          </button>
        ))}
      </div>
      <div key={sel} className="pop rounded-xl p-3" style={{background:"var(--surface2)"}}>
        <Molecula tipo={sel}/>
        <p className="text-sm mt-2">{c.d}</p>
      </div>
    </div>
  );
}

function PropiedadesPanel(){
  const props=[
    {l:"Estado físico",v:"Líquido"},{l:"Densidad",v:"0,78–0,81 g/cm³"},
    {l:"Punto de inflamación",v:"38–72 °C"},{l:"Punto de ebullición",v:"150–300 °C"},
    {l:"Solubilidad en agua",v:"Muy baja"},{l:"Color",v:"Transparente o amarillo claro"},
  ];
  const [temp,setTemp]=useState(25);
  let zona="Estado normal, por debajo del punto de inflamación.", color="var(--green-soft)";
  if(temp>=38 && temp<150){zona="Zona de riesgo: rango de punto de inflamación — sus vapores podrían encenderse ante una fuente de ignición."; color="var(--amber)";}
  else if(temp>=150){zona="Cercano a su rango de ebullición (150–300 °C, según la fracción)."; color="var(--danger)";}
  return (
    <div>
      <div className="grid grid-cols-2 gap-2 mb-4">
        {props.map(p=>(
          <div key={p.l} className="rounded-xl p-2.5" style={{background:"var(--surface2)"}}>
            <p className="text-[10px]" style={{color:"var(--text-dim)"}}>{p.l}</p>
            <p className="text-sm" style={{color:"var(--gold-soft)"}}>{p.v}</p>
          </div>
        ))}
      </div>
      <p className="text-xs mb-2" style={{color:"var(--text-dim)"}}>Termómetro educativo — moví el slider (simulación, no manipulación real).</p>
      <div className="flex items-center gap-3">
        <svg width="34" height="120" viewBox="0 0 34 120">
          <rect x="12" y="6" width="10" height="90" rx="5" fill="var(--surface2)" stroke="var(--line)"/>
          <rect x="12" y={96-Math.min(90,(temp/300)*90)} width="10" height={Math.min(90,(temp/300)*90)} rx="5" className="tank-liquid" fill={color}/>
          <circle cx="17" cy="106" r="10" fill={color}/>
        </svg>
        <div className="flex-1">
          <input type="range" min="0" max="300" value={temp} onChange={e=>setTemp(Number(e.target.value))} className="slider w-full"/>
          <p className="text-xs mt-1" style={{color:"var(--gold-soft)"}}>{temp} °C</p>
          <p key={zona} className="pop text-xs mt-2" style={{color}}>{zona}</p>
        </div>
      </div>
    </div>
  );
}

function TiposPanel(){
  const tipos=[
    {id:"domestico",t:"Doméstico",d:"Se usa en calefacción, cocinas y lámparas."},
    {id:"industrial",t:"Industrial",d:"Se emplea como solvente y como combustible para equipos industriales."},
    {id:"aviacion",t:"Aviación",d:"Comprende variantes como Jet A, Jet A-1 y Jet B, diseñadas para motores de reacción."},
  ];
  const [sel,setSel]=useState("aviacion");
  const [jet,setJet]=useState("Jet A-1");
  const t=tipos.find(x=>x.id===sel);
  const jetInfo={
    "Jet A":"Se utiliza principalmente en Estados Unidos, para vuelos domésticos.",
    "Jet A-1":"Es el más utilizado en vuelos internacionales. Está formulado para funcionar bien en condiciones de aviación y bajas temperaturas.",
    "Jet B":"Es una mezcla más liviana, usada en climas muy fríos por su mejor comportamiento a bajas temperaturas.",
  };
  return (
    <div>
      <div className="flex gap-2 mb-3">
        {tipos.map(x=>(
          <button key={x.id} onClick={()=>setSel(x.id)} className="chip flex-1 rounded-xl py-2 text-[11px]"
            style={{background:sel===x.id?"var(--surface2)":"transparent",border:"1px solid "+(sel===x.id?"var(--gold)":"var(--line)"),color:sel===x.id?"var(--gold-soft)":"var(--text-dim)"}}>
            {x.t}
          </button>
        ))}
      </div>
      <div key={sel} className="pop rounded-xl p-3" style={{background:"var(--surface2)"}}>
        <p className="text-sm">{t.d}</p>
        {sel==="aviacion" && (
          <div className="mt-3">
            <div className="flex gap-2 mb-2">
              {["Jet A","Jet A-1","Jet B"].map(j=>(
                <button key={j} onClick={()=>setJet(j)} className="chip rounded-full px-3 py-1 text-[11px]"
                  style={{background:jet===j?"var(--gold)":"transparent",color:jet===j?"#141110":"var(--text-dim)",border:"1px solid var(--line)"}}>
                  {j}
                </button>
              ))}
            </div>
            <p key={jet} className="pop text-xs" style={{color:"var(--text)"}}>{jetInfo[jet]}</p>
          </div>
        )}
      </div>
    </div>
  );
}

function UsosPanel(){
  const usos=[
    {e:"🔥",t:"Calefacción"},{e:"🍳",t:"Cocinas"},{e:"🏮",t:"Lámparas"},
    {e:"🧪",t:"Solvente industrial"},{e:"⚙️",t:"Equipos industriales"},{e:"✈️",t:"Combustible de aviación"},
  ];
  return (
    <div className="grid grid-cols-3 gap-2">
      {usos.map(u=>(
        <div key={u.t} className="rounded-xl p-3 text-center" style={{background:"var(--surface2)"}}>
          <div className="text-xl mb-1">{u.e}</div>
          <p className="text-[10px]" style={{color:"var(--text-dim)"}}>{u.t}</p>
        </div>
      ))}
    </div>
  );
}

const VENTAJAS=["Alto rendimiento energético","Fácil transporte","Almacenamiento relativamente sencillo","Buena estabilidad","Amplia disponibilidad","Menor volatilidad que la gasolina","Buen funcionamiento en condiciones climáticas extremas"];
const DESVENTAJAS=["Emisiones de gases de efecto invernadero","Contaminación atmosférica","Dependencia del petróleo","Precio influenciado por el mercado internacional","Riesgos asociados a derrames y vapores"];

function BalancePanel(){
  const [sel,setSel]=useState(null);
  return (
    <div>
      <p className="text-xs mb-3" style={{color:"var(--text-dim)"}}>Tocá un punto de cada lado de la balanza para ver el detalle.</p>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <p className="text-xs mb-1.5" style={{color:"var(--green-soft)"}}>Ventajas</p>
          <div className="space-y-1.5">
            {VENTAJAS.map((v,i)=>(
              <button key={i} onClick={()=>setSel("v"+i)} className="chip w-full text-left text-[11px] rounded-lg px-2 py-1.5"
                style={{background:sel==="v"+i?"var(--surface2)":"transparent",border:"1px solid "+(sel==="v"+i?"var(--green-soft)":"var(--line)"),color:sel==="v"+i?"var(--green-soft)":"var(--text-dim)"}}>
                {v}
              </button>
            ))}
          </div>
        </div>
        <div>
          <p className="text-xs mb-1.5" style={{color:"var(--danger)"}}>Desventajas</p>

   PANTALLA 3 — SIMULADOR
============================================================ */
function CombustionSim(){
  const [keroseno,setKeroseno]=useState(60);
  const [oxigeno,setOxigeno]=useState(70);
  const [intensidad,setIntensidad]=useState(50);
  const [on,setOn]=useState(false);

  const {energia,estado,mensaje}=useMemo(()=>{
    if(!on) return {energia:0,estado:"apagado",mensaje:"Presioná “Iniciar simulación” para comenzar."};
    if(keroseno<=2) return {energia:0,estado:"sin-combustible",mensaje:"No hay combustible disponible."};
    if(oxigeno<=20){
      const e=Math.round((keroseno*intensidad)/100*0.22);
      return {energia:e,estado:"limitada",mensaje:"Oxígeno limitado: la combustión simulada disminuye."};
    }
    const factor=Math.min(1,oxigeno/65);
    const e=Math.round((keroseno/100)*(intensidad/100)*factor*100);
    return {energia:e,estado:"activa",mensaje:"Combustión activa: el combustible libera energía principalmente en forma de calor."};
  },[keroseno,oxigeno,intensidad,on]);

  const flameOn = on && energia>2;
  const flameScale=0.35+Math.min(1,energia/100)*0.95;
  const flameColor= estado==="limitada" ? "#d9614f" : (energia>60?"#f4c542":"#e8792b");

  function reiniciar(){ setKeroseno(60); setOxigeno(70); setIntensidad(50); setOn(false); }

  return (
    <div>
      <div className="rounded-2xl p-3 mb-4" style={{background:"var(--surface)",border:"1px solid var(--line)"}}>
        <svg viewBox="0 0 300 190" width="100%" height="auto">
          <rect x="10" y="20" width="60" height="120" rx="8" fill="#0f0d09" stroke="var(--line)" strokeWidth="2"/>
          <rect x="14" y={140-Math.max(4,keroseno)*1.1} width="52" height={Math.max(4,keroseno)*1.1-4} className="tank-liquid" fill="var(--gold)" opacity="0.85"/>
          <text x="40" y="163" textAnchor="middle" fontSize="9" fill="var(--gold-soft)">{keroseno}%</text>
          <path d="M70 118 H150 V150" stroke="var(--line)" strokeWidth="8" fill="none" strokeLinecap="round"/>
          {flameOn && <path d="M70 118 H150 V150" stroke="var(--gold-soft)" strokeWidth="3" fill="none" strokeDasharray="6 6" className="pipe-flow" strokeLinecap="round"/>}
          <rect x="105" y="150" width="90" height="34" rx="6" fill="#181410" stroke="var(--line)" strokeWidth="2"/>
          <g transform={`translate(150,150) scale(${flameScale})`} opacity={flameOn?1:0}>
            <path className={"flame "+(flameOn?"":"off")} d="M0,-2 C10,-22 -6,-30 0,-52 C14,-40 22,-14 8,4 C16,-2 18,-14 18,-14 C24,4 12,20 0,20 C-14,20 -22,2 -14,-10 C-14,-10 -10,-2 -10,-6 C-12,-16 -6,-24 0,-2 Z" fill={flameColor}/>
          </g>
          <g opacity={Math.max(0.15,oxigeno/100)}>
            {[0,1,2,3].map(i=>(<circle key={i} className="molecule" cx={225+(i%2)*14} cy={20+Math.floor(i/2)*16} r="4" fill="#8fb3c9" style={{animationDelay:(i*0.5)+"s"}}/>))}
          </g>
          <text x="255" y="55" textAnchor="middle" fontSize="8" fill="var(--text-dim)">O₂</text>
          <rect x="230" y="80" width="16" height="90" rx="4" fill="none" stroke="var(--line)" strokeWidth="2"/>
          <rect x="230" y={170-Math.max(0,energia)*0.9} width="16" height={Math.max(0,energia)*0.9} rx="4" fill={energia>60?"var(--gold-soft)":"var(--amber)"} className="tank-liquid"/>
          <text x="238" y="180" textAnchor="middle" fontSize="8" fill="var(--text-dim)">Energía</text>
        </svg>
      </div>

      <div key={mensaje} className="pop rounded-xl px-4 py-3 mb-4 text-sm" style={{background:"var(--surface2)",border:"1px solid "+(estado==="limitada"?"var(--danger)":"var(--line)")}}>{mensaje}</div>

      <div className="space-y-4 mb-5">
        {[["Cantidad de queroseno",keroseno,setKeroseno],["Oxígeno disponible",oxigeno,setOxigeno],["Intensidad de combustión",intensidad,setIntensidad]].map(([l,v,set])=>(
          <div key={l}>
            <div className="flex justify-between text-xs mb-1"><span style={{color:"var(--text-dim)"}}>{l}</span><span style={{color:"var(--gold-soft)"}}>{v}%</span></div>
            <input type="range" min="0" max="100" value={v} onChange={e=>set(Number(e.target.value))} className="slider w-full"/>
          </div>
        ))}
      </div>

      <div className="flex gap-3">
        <button onClick={()=>setOn(v=>!v)} className="flex-1 rounded-2xl py-3 font-medium text-sm"
          style={{background:on?"var(--surface2)":"linear-gradient(90deg,var(--amber) 0%, var(--gold) 100%)",border:on?"1px solid var(--gold)":"none",color:on?"var(--gold-soft)":"#141110"}}>
          {on?"Detener":"Iniciar simulación"}
        </button>
        <button onClick={reiniciar} className="rounded-2xl px-4 py-3 text-sm" style={{border:"1px solid var(--line)",color:"var(--text-dim)"}}>Reiniciar</button>
      </div>

      {on && energia>2 && (
        <div className="mt-5">
          <p className="text-xs mb-2" style={{color:"var(--green-soft)"}}>Combustión del queroseno — productos</p>
          <div className="flex flex-wrap gap-2">
            {(estado==="limitada" ? ["CO","Material particulado"] : ["CO₂","H₂O","NOₓ","SO₂*"]).map((g,i)=>(
              <span key={g} className="pop text-[11px] rounded-full px-2.5 py-1" style={{animationDelay:(i*0.1)+"s",background:"var(--surface2)",border:"1px solid var(--line)",color:"var(--text-dim)"}}>{g}</span>
            ))}
          </div>
          <p className="text-[10px] mt-2" style={{color:"var(--text-dim)"}}>
            {estado==="limitada"
              ? "Una combustión incompleta, por falta de oxígeno, puede generar monóxido de carbono (CO) y hollín."
              : "Una combustión completa de hidrocarburos produce principalmente dióxido de carbono y agua; en condiciones reales también pueden generarse otros compuestos (*SO₂ en algunos combustibles)."}
          </p>
        </div>
      )}
    </div>
  );
}

    {id:"empuje",e:"💨",t:"Empuje",d:"La energía liberada se transforma en el empuje que impulsa al avión hacia adelante."},
  ];
  const [sel,setSel]=useState("motores");
  const s=elems.find(x=>x.id===sel);
  return (
    <div>
      <svg viewBox="0 0 260 70" width="100%" height="60" className="mb-3">
        <path d="M10 40l70-14 24-6 8 6-10 10 90-4 6 8-6 8-90-4 10 10-8 6-24-6-70-14Z" fill="none" stroke="var(--text-dim)" strokeWidth="1.4" className="plane-fly"/>

      <div className="flex justify-between gap-2 mb-3">
        {elems.map(el=>(
          <button key={el.id} onClick={()=>setSel(el.id)} className="chip flex-1 rounded-xl py-2 text-center"
            style={{background:sel===el.id?"var(--surface2)":"transparent",border:"1px solid "+(sel===el.id?"var(--gold)":"var(--line)")}}>
            <div className="text-base">{el.e}</div>
            <p className="text-[9px] mt-0.5" style={{color:sel===el.id?"var(--gold-soft)":"var(--text-dim)"}}>{el.t}</p>
          </button>
        ))}
      </div>
      <div key={sel} className="pop text-sm rounded-xl p-3" style={{background:"var(--surface2)"}}>{s.d}</div>
    </div>
  );
}

function VueloSim(){
  const vuelos={corto:{label:"Vuelo corto",pct:28},medio:{label:"Vuelo medio",pct:62},largo:{label:"Vuelo largo",pct:100}};
  const [tipo,setTipo]=useState("medio");
  const v=vuelos[tipo];
  return (
    <div>
      <div className="flex gap-2 mb-4">
        {Object.entries(vuelos).map(([k,val])=>(
          <button key={k} onClick={()=>setTipo(k)} className="chip flex-1 rounded-xl py-2 text-xs"
            style={{background:tipo===k?"var(--surface2)":"transparent",border:"1px solid "+(tipo===k?"var(--gold)":"var(--line)"),color:tipo===k?"var(--gold-soft)":"var(--text-dim)"}}>
            {val.label}
          </button>
        ))}
      </div>
      <div className="relative rounded-xl p-4 mb-3 overflow-hidden" style={{background:"linear-gradient(180deg,#0f1a22,var(--surface2))",height:80}}>
        <div className="absolute bottom-3 left-3 right-3 h-[1px]" style={{background:"var(--line)"}}/>
        <div className="absolute bottom-4 transition-all duration-700" style={{left:`calc(${v.pct}% - 18px)`}}>
          <svg width="36" height="20" viewBox="0 0 36 20" className="plane-fly"><path d="M2 12l16-4 6-6 3 1-3 5 10 0 3 2-3 2-10 0 3 5-3 1-6-6-16-4Z" fill="var(--gold-soft)"/></svg>
        </div>
      </div>
      <p className="text-xs mb-1" style={{color:"var(--text-dim)"}}>Combustible utilizado (valor relativo)</p>
      <div className="w-full h-3 rounded-full overflow-hidden mb-3" style={{background:"var(--surface2)"}}>
        <div className="h-full progress-fill rounded-full" style={{width:v.pct+"%",background:"linear-gradient(90deg,var(--amber),var(--gold-soft))"}}/>
      </div>
      <div className="rounded-xl p-3 text-xs" style={{background:"var(--surface2)",color:"var(--text-dim)"}}>
        Un avión comercial de gran tamaño puede consumir más de 10.000 litros de queroseno durante trayectos largos — un ejemplo aproximado, no una cifra universal.
      </div>
    </div>
  );
}

const PORQUE=[
  {t:"Alto contenido energético",d:"Permite almacenar mucha energía en una cantidad relativamente pequeña de combustible."},
  {t:"Baja volatilidad respecto de la gasolina",d:"Característica importante para su utilización y almacenamiento en aviación."},
  {t:"Buen comportamiento a bajas temperaturas",d:"Importante debido a las condiciones existentes durante los vuelos a gran altitud."},
  {t:"Disponibilidad",d:"Es un combustible ampliamente utilizado dentro de la aviación comercial."},
];
function PorQueAviacion(){
  const [sel,setSel]=useState(null);
  return (
    <div className="grid grid-cols-2 gap-2">
      {PORQUE.map((p,i)=>(
        <button key={i} onClick={()=>setSel(sel===i?null:i)} className="chip rounded-xl p-3 text-left"
          style={{background:sel===i?"var(--surface2)":"var(--surface)",border:"1px solid "+(sel===i?"var(--gold)":"var(--line)")}}>
          <p className="text-xs" style={{color:sel===i?"var(--gold-soft)":"var(--text)"}}>{p.t}</p>
          {sel===i && <p className="pop text-[11px] mt-1.5" style={{color:"var(--text-dim)"}}>{p.d}</p>}
        </button>
      ))}
    </div>
  );
}

function AviacionScreen(){
  return (
    <div className="max-w-md mx-auto px-5 pt-8 pb-28">
      <SectionTitle eyebrow="El combustible del cielo" title="Queroseno y aviación" sub="Del tanque al empuje: así funciona el queroseno en un motor a reacción."/>
      <Panel><AvionDiagrama/></Panel>
      <h3 className="font-display text-lg mt-6 mb-1">Simulador de vuelo educativo</h3>
      <Panel><VueloSim/></Panel>
      <h3 className="font-display text-lg mt-6 mb-2">¿Por qué se usa queroseno en aviación?</h3>
      <PorQueAviacion/>
    </div>
  );
}

/* ============================================================
   PANTALLA 5 — IMPACTO
============================================================ */
function EmisionesPanel(){
  const emis=[
    {g:"CO₂",d:"Principal producto de una combustión completa; contribuye al efecto invernadero."},
    {g:"NOₓ",d:"Óxidos de nitrógeno, generados por las altas temperaturas de la combustión."},
    {g:"CO",d:"Monóxido de carbono, asociado a combustión incompleta."},
    {g:"SO₂",d:"Presente en algunos combustibles, según su contenido de azufre."},
    {g:"Material particulado",d:"Pequeñas partículas sólidas liberadas durante la combustión."},
  ];
  const [sel,setSel]=useState(0);
  return (
    <div>
      <svg viewBox="0 0 200 50" width="100%" height="44" className="mb-3">
        <path d="M6 30l50-10 18-4 6 4-8 8 66-2 4 6-4 6-66-2 8 8-6 4-18-4-50-10Z" fill="none" stroke="var(--text-dim)" strokeWidth="1.2" className="plane-fly"/>
        {[0,1,2].map(i=>(<circle key={i} className="puff" cx={4-i*4} cy="30" r="4" fill="#6b6b66" style={{animationDelay:(i*0.7)+"s"}}/>))}
      </svg>
      <div className="flex flex-wrap gap-2 mb-3">
        {emis.map((e,i)=>(
          <button key={e.g} onClick={()=>setSel(i)} className="chip rounded-full px-3 py-1.5 text-[11px]"
            style={{background:sel===i?"var(--surface2)":"transparent",border:"1px solid "+(sel===i?"var(--gold)":"var(--line)"),color:sel===i?"var(--gold-soft)":"var(--text-dim)"}}>
            {e.g}
          </button>
        ))}
      </div>
      <div key={sel} className="pop text-sm rounded-xl p-3 mb-2" style={{background:"var(--surface2)"}}>{emis[sel].d}</div>
      <p className="text-xs" style={{color:"var(--text-dim)"}}>La combustión del queroseno genera emisiones que contribuyen a la contaminación atmosférica y al efecto invernadero.</p>
    </div>
  );
}

function SafComparacion(){
  const [v,setV]=useState(30);
  const esSaf=v>50;
  return (
    <div>
      <div className="flex justify-between text-xs mb-1">
        <span style={{color:"var(--danger)"}}>Queroseno convencional</span>
        <span style={{color:"var(--green-soft)"}}>SAF</span>
      </div>
      <input type="range" min="0" max="100" value={v} onChange={e=>setV(Number(e.target.value))} className="slider w-full mb-3"/>
      <div key={esSaf?"saf":"conv"} className="pop rounded-xl p-3 text-sm" style={{background:"var(--surface2)"}}>
        {esSaf
          ? <>Los <span style={{color:"var(--green-soft)"}}>SAF (Sustainable Aviation Fuel)</span> pueden producirse a partir de aceites vegetales, residuos orgánicos, biomasa y residuos industriales reciclados.</>
          : <>El <span style={{color:"var(--danger)"}}>queroseno convencional</span> se obtiene exclusivamente de la refinación del petróleo, un recurso no renovable.</>}
      </div>
      <p className="text-[10px] mt-2 italic" style={{color:"var(--text-dim)"}}>Los combustibles sostenibles buscan reducir las emisiones de carbono respecto de los combustibles fósiles convencionales — no son completamente libres de emisiones.</p>
    </div>
  );
}

const PREGUNTAS=[
  {q:"¿De dónde se obtiene el queroseno?",op:["Del petróleo mediante refinación","De la biomasa directamente","Del carbón","Únicamente del gas natural"],c:0,ex:"El queroseno se obtiene mediante la refinación (destilación fraccionada) del petróleo."},
  {q:"¿Por qué el queroseno no tiene una fórmula química única?",op:["Porque es una mezcla de hidrocarburos","Porque es un elemento puro","Porque cambia de color","Porque es un gas"],c:0,ex:"Es una mezcla de distintos hidrocarburos, no una sustancia pura."},
  {q:"¿Qué proceso se utiliza para separar sus fracciones?",op:["Destilación fraccionada","Electrólisis","Fermentación","Cristalización"],c:0,ex:"La destilación fraccionada separa las fracciones del petróleo según su punto de ebullición."},
  {q:"¿Cuál es aproximadamente su poder calorífico?",op:["≈43 MJ/kg","≈4,3 MJ/kg","≈430 MJ/kg","≈0,43 MJ/kg"],c:0,ex:"El poder calorífico aproximado del queroseno es de 43 MJ/kg."},
  {q:"¿Cuál es uno de sus principales usos actuales?",op:["Combustible de aviación","Combustible nuclear","Fabricación de plásticos únicamente","Producción de electricidad solar"],c:0,ex:"Actualmente uno de sus usos principales es como combustible de aviación."},
  {q:"¿Qué tipo de queroseno se usa mayormente en vuelos internacionales?",op:["Jet A-1","Jet B","Queroseno doméstico","Queroseno industrial"],c:0,ex:"El Jet A-1 es el más utilizado en vuelos internacionales."},
  {q:"¿Qué se produce en una combustión completa de hidrocarburos?",op:["Principalmente CO₂ y H₂O","Solo oxígeno","Solo hollín","Nitrógeno puro"],c:0,ex:"Una combustión completa libera principalmente dióxido de carbono y agua."},
  {q:"¿Qué puede generarse en condiciones reales de combustión?",op:["NOₓ y CO, entre otros","Únicamente vapor de agua","Únicamente oxígeno","Hidrógeno puro"],c:0,ex:"Las condiciones reales de combustión pueden generar NOₓ, CO y otros compuestos."},
  {q:"¿Qué significa SAF?",op:["Sustainable Aviation Fuel","Solid Aircraft Fuel","Standard Aviation Formula","Synthetic Aircraft Fluid"],c:0,ex:"SAF significa Sustainable Aviation Fuel (combustible sostenible de aviación)."},
  {q:"¿Por qué el queroseno es importante para la aviación?",op:["Por su alto contenido energético y baja volatilidad","Porque es el combustible más barato del mercado","Porque no genera ningún tipo de emisión","Porque solo funciona a altas temperaturas"],c:0,ex:"Su alto contenido energético y su baja volatilidad lo hacen ideal para la aviación."},
];

function Quiz(){
  const [i,setI]=useState(0);
  const [resp,setResp]=useState(null);
  const [score,setScore]=useState(0);
  const [fin,setFin]=useState(false);
  const p=PREGUNTAS[i];

  function elegir(idx){
    if(resp!==null) return;
    setResp(idx);
    if(idx===p.c) setScore(s=>s+1);
  }
  function siguiente(){
    if(i+1<PREGUNTAS.length){ setI(i+1); setResp(null); } else { setFin(true); }
  }
  function reiniciar(){ setI(0); setResp(null); setScore(0); setFin(false); }

  if(fin){
    return (
      <div className="text-center">
        <p className="font-display text-2xl mb-2">CONOCIMIENTO DEL QUEROSENO</p>
        <p className="font-display text-4xl mb-3" style={{color:"var(--gold-soft)"}}>{score}/10</p>
        <div className="w-full h-3 rounded-full overflow-hidden mb-4" style={{background:"var(--surface2)"}}>
          <div className="h-full progress-fill rounded-full" style={{width:(score*10)+"%",background:"linear-gradient(90deg,var(--amber),var(--gold-soft))"}}/>
        </div>
        <button onClick={reiniciar} className="rounded-2xl px-5 py-2.5 text-sm" style={{background:"var(--gold)",color:"#141110"}}>Volver a intentar</button>
      </div>
    );
  }

  return (
    <div>
      <div className="flex justify-between text-xs mb-2" style={{color:"var(--text-dim)"}}>
        <span>Pregunta {i+1} de {PREGUNTAS.length}</span><span>Puntaje: {score}</span>
      </div>
      <div className="w-full h-1.5 rounded-full overflow-hidden mb-4" style={{background:"var(--surface2)"}}>
        <div className="h-full progress-fill rounded-full" style={{width:((i)/PREGUNTAS.length*100)+"%",background:"var(--gold)"}}/>
      </div>
      <p key={"q"+i} className="pop text-sm mb-3">{p.q}</p>
      <div className="space-y-2">
        {p.op.map((o,idx)=>{
          let style={border:"1px solid var(--line)",color:"var(--text)"};
          if(resp!==null){
            if(idx===p.c) style={border:"1px solid var(--green-soft)",background:"rgba(143,196,163,0.12)",color:"var(--green-soft)"};
            else if(idx===resp) style={border:"1px solid var(--danger)",background:"rgba(217,97,79,0.12)",color:"var(--danger)"};
          }
          return (
            <button key={idx} onClick={()=>elegir(idx)} className="chip w-full text-left rounded-xl px-3 py-2.5 text-xs" style={style}>{o}</button>
          );
        })}
      </div>
      {resp!==null && (
        <div className="pop mt-3 text-xs rounded-xl p-3" style={{background:"var(--surface2)"}}>
          <p className="mb-1" style={{color:resp===p.c?"var(--green-soft)":"var(--danger)"}}>{resp===p.c?"¡Correcto!":"No es correcto."}</p>
          <p style={{color:"var(--text-dim)"}}>{p.ex}</p>
          <button onClick={siguiente} className="mt-3 rounded-xl px-4 py-2 text-xs" style={{background:"var(--gold)",color:"#141110"}}>{i+1<PREGUNTAS.length?"Siguiente →":"Ver resultado"}</button>
        </div>
      )}
    </div>
  );
}

const DATOS=[
  {n:"43 MJ/kg",l:"Poder calorífico aproximado"},
  {n:"0,78–0,81 g/cm³",l:"Densidad aproximada"},
  {n:"150–300 °C",l:"Rango aproximado de ebullición"},
  {n:"10–16",l:"Átomos de carbono predominantes"},
  {n:"Siglo XIX",l:"Comienzo de su gran expansión"},
];
function DatosClave(){
  return (
    <div className="grid grid-cols-2 gap-2.5">
      {DATOS.map((d,i)=>(
        <div key={d.l} className="pop rounded-xl p-3" style={{animationDelay:(i*0.08)+"s",background:"var(--surface2)",border:"1px solid var(--line)"}}>
          <p className="font-display text-lg" style={{color:"var(--gold-soft)"}}>{d.n}</p>
          <p className="text-[10px] mt-0.5" style={{color:"var(--text-dim)"}}>{d.l}</p>
        </div>
      ))}
    </div>
  );
}

function ImpactoScreen(){
  return (
    <div className="max-w-md mx-auto px-5 pt-8 pb-28">
      <SectionTitle eyebrow="Costos y alternativas" title="El costo ambiental del queroseno" sub="Emisiones, combustibles sostenibles y un repaso final de todo lo aprendido."/>
      <Panel><EmisionesPanel/></Panel>
      <h3 className="font-display text-lg mt-6 mb-1">Queroseno vs. SAF</h3>
      <Panel><SafComparacion/></Panel>
      <h3 className="font-display text-lg mt-6 mb-1">Desafío del queroseno</h3>
      <Panel><Quiz/></Panel>
      <h3 className="font-display text-lg mt-6 mb-1">Queroseno en 60 segundos</h3>
      <Panel><DatosClave/></Panel>
    </div>
  );
}

   APP
============================================================ */
function App(){
  const [screen,setScreen]=useState("explorar");
  const screens={explorar:ExplorarScreen,produccion:ProduccionScreen,simulador:SimuladorScreen,aviacion:AviacionScreen,impacto:ImpactoScreen};
  const Screen=screens[screen];
  return (
    <div>
      <Screen/>
      <BottomNav screen={screen} setScreen={setScreen}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
